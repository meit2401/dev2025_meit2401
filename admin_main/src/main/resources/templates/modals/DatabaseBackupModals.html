<!-- バックアップモーダル -->
<div th:fragment="backupModal">
	<form th:action="@{/database/backup}" method="post">
		<div class="modal fade" id="backupModal" tabindex="-1" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered custom-modal">
				<div class="modal-content">
					<div class="modal-body custom-text text-center">
						<span id="backupRangeText">YYYY/MM から<br>YYYY/MM までの</span>
						<br>バックアップを作成します
					</div>
					<div class="modal-footer d-flex justify-content-center gap-3">
						<button type="submit" class="btn custom-btn-modal btn-danger" style="width: 20%">OK</button>
						<button type="button" class="btn custom-btn-modal btn-secondary" data-bs-dismiss="modal" style="width: 20%">キャンセル</button>
					</div>
				</div>
			</div>
			
			<input type="hidden" id="hiddenStartYear" name="startYear">
			<input type="hidden" id="hiddenStartMonth" name="startMonth">
			<input type="hidden" id="hiddenEndYear" name="endYear">
			<input type="hidden" id="hiddenEndMonth" name="endMonth">
		</div>
	</form>
</div>
